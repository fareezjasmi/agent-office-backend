<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Forecast</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">🌦️ Weather Forecast</h1>

      <form class="search-bar" id="searchForm" autocomplete="off">
        <input
          type="text"
          id="cityInput"
          class="city-input"
          placeholder="Search for a city..."
          aria-label="City name"
        >
        <button type="submit" id="searchBtn" class="btn btn-primary">Search</button>
      </form>

      <div class="header-actions">
        <button type="button" id="geoBtn" class="btn btn-secondary">
          📍 Use my location
        </button>
        <button type="button" id="unitToggle" class="btn btn-toggle" aria-pressed="false">
          Switch to °F
        </button>
      </div>
    </header>

    <main class="main">
      <!-- Loading indicator -->
      <div id="loading" class="loading hidden" role="status" aria-live="polite">
        <div class="spinner"></div>
        <p>Loading weather data...</p>
      </div>

      <!-- Error message -->
      <div id="errorMessage" class="error-message hidden" role="alert"></div>

      <!-- Welcome / empty state -->
      <div id="welcomeMessage" class="welcome">
        <p>👋 Search a city or use your location to see the forecast.</p>
      </div>

      <!-- Weather content -->
      <section id="weatherContent" class="weather-content hidden">
        <div class="current-weather" id="currentWeather">
          <div class="current-top">
            <div class="location-block">
              <h2 id="locationName" class="location-name">--</h2>
              <p id="dayNight" class="day-night"></p>
            </div>
            <div class="current-icon-block">
              <span id="currentIcon" class="current-icon">☀️</span>
              <p id="currentDescription" class="current-description">--</p>
            </div>
          </div>

          <div class="current-middle">
            <span id="currentTemp" class="current-temp">--°</span>
            <span id="feelsLike" class="feels-like">Feels like --°</span>
          </div>

          <div class="current-details">
            <div class="detail-item">
              <span class="detail-label">💧 Humidity</span>
              <span id="humidity" class="detail-value">--%</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">💨 Wind</span>
              <span id="windSpeed" class="detail-value">-- km/h</span>
            </div>
          </div>
        </div>

        <h3 class="forecast-title">7-Day Forecast</h3>
        <div id="forecastGrid" class="forecast-grid">
          <!-- forecast cards injected by JS -->
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Data provided by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></p>
    </footer>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
